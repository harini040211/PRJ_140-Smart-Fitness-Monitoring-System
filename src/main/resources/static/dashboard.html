<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | FitTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
<div id="content" hidden>
  <div id="state"></div>
  <div id="view" class="hide">
    <div class="hero">
      <div>
        <h1 id="greeting"></h1>
        <p id="hero-line"></p>
      </div>
      <div class="hero-stats" id="hero-stats"></div>
    </div>

    <div class="grid g4 mt" id="tiles"></div>

    <div class="grid g-main mt">
      <div class="stack">
        <div class="card">
          <div class="card-head"><h2>Today's balance</h2><span class="sub" id="balance-note"></span></div>
          <div class="rings" id="rings"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Last 7 days</h2><span class="sub">Calories eaten vs burned</span></div>
          <div class="chart-box"><canvas id="weekChart"></canvas></div>
        </div>
        <div class="grid g2">
          <div class="card">
            <div class="card-head"><h2>Recent workouts</h2><a href="workout.html">View all</a></div>
            <div class="list" id="recent-workouts"></div>
          </div>
          <div class="card">
            <div class="card-head"><h2>Recent meals</h2><a href="diet.html">View all</a></div>
            <div class="list" id="recent-meals"></div>
          </div>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="card-head"><h2>Insights for you</h2></div>
          <div class="insights" id="insights"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Water</h2><span class="sub" id="water-note"></span></div>
          <div class="water-glasses" id="glasses"></div>
          <div class="progress teal"><i id="water-bar" style="width:0"></i></div>
          <div class="chips mt">
            <button class="chip" data-ml="250" type="button">+250 ml</button>
            <button class="chip" data-ml="500" type="button">+500 ml</button>
            <button class="chip" id="water-undo" type="button">Undo last</button>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Today's activity</h2></div>
          <div class="form-grid">
            <div class="field"><label for="steps">Steps</label><input id="steps" type="number" min="0" max="100000" inputmode="numeric"></div>
            <div class="field"><label for="active">Active minutes</label><input id="active" type="number" min="0" max="1440" inputmode="numeric"></div>
          </div>
          <button class="btn secondary block" id="save-activity" type="button">Save activity</button>
        </div>
        <div class="card">
          <div class="card-head"><h2>Macros today</h2></div>
          <div id="macros"></div>
        </div>
      </div>
    </div>

    <div class="grid g2 mt">
      <div class="card">
        <div class="card-head"><h2>Streaks</h2></div>
        <div class="streaks" id="streaks"></div>
        <div class="card-head mt"><h2>This week</h2><span class="sub" id="week-note"></span></div>
        <div class="progress green"><i id="week-bar" style="width:0"></i></div>
        <div class="stat-pills mt" id="week-pills"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Weight trend</h2><span class="sub" id="weight-note"></span></div>
        <div class="chart-box short"><canvas id="weightChart"></canvas></div>
      </div>
    </div>

    <div class="card mt">
      <div class="card-head"><h2>Achievements</h2><span class="sub" id="achv-note"></span></div>
      <div class="badges" id="badges"></div>
    </div>
  </div>
</div>

<script src="js/vendor/chart.umd.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/charts.js"></script>
<script>
const ACHIEVEMENT_ICONS = {
  "first-workout": "dumbbell", "five-workouts": "dumbbell", "twenty-five-workouts": "trophy", "thousand-kcal": "flame",
  "streak-3": "zap", "streak-7": "zap", "first-meal": "utensils", "ten-meals": "utensils", "hydration": "droplet",
  "step-goal": "steps", "weigh-in": "scale", "halfway": "target"
};

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
}

function showSkeleton() {
  document.getElementById("state").innerHTML =
    '<div class="skeleton skel-card"></div><div class="grid g4 mt"><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div></div><div class="skeleton skel-tall mt"></div>';
}

function renderTiles(s) {
  const tiles = [
    ["flame", "tone-orange", "Calories eaten", num(s.caloriesEatenToday), "kcal", "Target " + num(s.calorieTarget) + " kcal"],
    ["zap", "tone-red", "Calories burned", num(s.caloriesBurnedToday), "kcal", num(s.workoutMinutesToday) + " min of workouts"],
    ["steps", "tone-green", "Steps", num(s.stepsToday), "", "Goal " + num(s.stepGoal)],
    ["heart", "tone-violet", "BMI", num(s.bmi, 1), "", s.bmiCategory]
  ];
  document.getElementById("tiles").innerHTML = tiles.map((t) =>
    '<div class="card stat"><div class="stat-icon ' + t[1] + '">' + icon(t[0]) + '</div><div><div class="label">' + t[2] +
    '</div><div class="value">' + t[3] + (t[4] ? "<small>" + t[4] + "</small>" : "") + '</div><div class="note">' + esc(t[5]) + "</div></div></div>").join("");
}

function renderRings(s) {
  const eatenPct = s.calorieTarget ? (s.caloriesEatenToday / s.calorieTarget) * 100 : 0;
  const left = s.remainingCalories;
  const rings = [
    [eatenPct, eatenPct > 105 ? PALETTE.red : PALETTE.orange, num(Math.abs(left)), left >= 0 ? "kcal left" : "kcal over", "Calories", num(s.caloriesEatenToday) + " eaten"],
    [(s.weeklyWorkoutCount / s.weeklyWorkoutGoal) * 100, PALETTE.green, s.weeklyWorkoutCount + "/" + s.weeklyWorkoutGoal, "workouts", "Weekly goal", num(s.weeklyMinutes) + " min"],
    [(s.waterTodayMl / s.waterGoalMl) * 100, PALETTE.teal, num(s.waterTodayMl / 1000, 1) + "L", "of " + num(s.waterGoalMl / 1000, 1) + "L", "Hydration", ""],
    [(s.stepsToday / s.stepGoal) * 100, PALETTE.blue, num(s.stepsToday), "steps", "Step goal", "Goal " + num(s.stepGoal)]
  ];
  document.getElementById("rings").innerHTML = rings.map((r) =>
    '<div class="ring-item">' + ringHtml(r[0], r[1], r[2], r[3]) + '<div class="cap">' + r[4] + (r[5] ? "<span>" + r[5] + "</span>" : "") + "</div></div>").join("");
  document.getElementById("balance-note").textContent =
    "Target " + num(s.calorieTarget) + " kcal, plus " + num(s.caloriesBurnedToday) + " burned";
}

function renderLists(s) {
  const exercises = (catalogCache.exercises || []);
  const artFor = (name) => (exercises.find((e) => e.name === name) || {}).icon || "🏃";
  const foods = (catalogCache.foods || []);
  const foodArt = (name) => (foods.find((f) => f.name === name) || {}).icon || "🍽️";

  document.getElementById("recent-workouts").innerHTML = s.recentWorkouts.length
    ? s.recentWorkouts.map((w) =>
        '<div class="row"><div class="art">' + artFor(w.exerciseType) + '</div><div class="grow"><b>' + esc(w.exerciseType) + "</b><span>" +
        prettyDate(w.date) + " · " + w.durationMinutes + " min · " + esc(w.intensity) + '</span></div><div class="end">' + num(w.caloriesBurned) + "<small>kcal</small></div></div>").join("")
    : emptyState("dumbbell", "No workouts yet", "Start one from the Workouts page.");

  document.getElementById("recent-meals").innerHTML = s.recentMeals.length
    ? s.recentMeals.map((m) =>
        '<div class="row"><div class="art">' + foodArt(m.foodName) + '</div><div class="grow"><b>' + esc(m.foodName) + "</b><span>" +
        prettyDate(m.date) + " · " + esc(m.mealType) + '</span></div><div class="end">' + num(m.calories) + "<small>kcal</small></div></div>").join("")
    : emptyState("utensils", "No meals yet", "Log your first meal from the Nutrition page.");
}

function renderRest(s) {
  const insightIcon = { good: "check", warn: "alert", tip: "info" };
  document.getElementById("insights").innerHTML = s.insights.map((i) =>
    '<div class="insight ' + i.tone + '">' + icon(insightIcon[i.tone] || "info") + "<div><b>" + esc(i.title) + "</b><span>" + esc(i.text) + "</span></div></div>").join("");

  const glassCount = Math.max(1, Math.round(s.waterGoalMl / 250));
  const filled = s.waterTodayMl / 250;
  let glasses = "";
  for (let i = 0; i < glassCount; i++) {
    const cls = filled >= i + 1 ? "full" : filled >= i + 0.5 ? "half" : "";
    glasses += '<div class="glass ' + cls + '"><i></i></div>';
  }
  document.getElementById("glasses").innerHTML = glasses;
  document.getElementById("water-bar").style.width = Math.min(100, (s.waterTodayMl / s.waterGoalMl) * 100) + "%";
  document.getElementById("water-note").textContent = num(s.waterTodayMl) + " of " + num(s.waterGoalMl) + " ml";

  document.getElementById("steps").value = s.stepsToday || "";
  document.getElementById("active").value = s.activeMinutesToday || "";

  document.getElementById("macros").innerHTML =
    meterHtml("Protein", s.proteinToday, s.proteinTargetG, "g", "") +
    meterHtml("Carbs", s.carbsToday, s.carbsTargetG, "g", "orange") +
    meterHtml("Fat", s.fatToday, s.fatTargetG, "g", "red");

  const streakItems = [["Workout", s.streaks.workout], ["Meals", s.streaks.meals], ["Water", s.streaks.water]];
  document.getElementById("streaks").innerHTML = streakItems.map((x) =>
    '<div class="streak ' + (x[1] >= 3 ? "hot" : "") + '">' + icon("flame") + "<b>" + x[1] + "</b><span>" + x[0] + " streak (days)</span></div>").join("");

  const weekPct = Math.min(100, (s.weeklyWorkoutCount / s.weeklyWorkoutGoal) * 100);
  document.getElementById("week-bar").style.width = weekPct + "%";
  document.getElementById("week-note").textContent = s.weeklyWorkoutCount + " of " + s.weeklyWorkoutGoal + " workouts";
  document.getElementById("week-pills").innerHTML =
    '<div class="pill-stat"><b>' + num(s.weeklyMinutes) + "</b><span>Minutes</span></div>" +
    '<div class="pill-stat"><b>' + num(s.weeklyCaloriesBurned) + "</b><span>kcal burned</span></div>" +
    '<div class="pill-stat"><b>' + s.weeklyActiveDays + "</b><span>Active days</span></div>";

  const unlocked = s.achievements.filter((a) => a.unlocked).length;
  document.getElementById("achv-note").textContent = unlocked + " of " + s.achievements.length + " unlocked";
  document.getElementById("badges").innerHTML = s.achievements.map((a) =>
    '<div class="achv ' + (a.unlocked ? "" : "locked") + '"><div class="medal">' + icon(ACHIEVEMENT_ICONS[a.key] || "trophy") + "</div><b>" +
    esc(a.name) + "</b><span>" + esc(a.description) + "</span></div>").join("");
}

function renderCharts(s) {
  drawChart("weekChart", {
    type: "bar",
    data: {
      labels: s.week.map((d) => shortDay(d.date)),
      datasets: [
        { label: "Eaten", data: s.week.map((d) => d.caloriesEaten), backgroundColor: PALETTE.orange, borderRadius: 6 },
        { label: "Burned", data: s.week.map((d) => d.caloriesBurned), backgroundColor: PALETTE.blue, borderRadius: 6 }
      ]
    },
    options: { scales: axisOptions(), plugins: { legend: { position: "bottom", labels: { usePointStyle: true } } } }
  });

  const history = s.weightHistory;
  document.getElementById("weight-note").textContent = s.targetWeight
    ? "Now " + num(s.currentWeight, 1) + " kg, target " + num(s.targetWeight, 1) + " kg"
    : "Now " + num(s.currentWeight, 1) + " kg";
  const datasets = [{
    label: "Weight (kg)", data: history.map((h) => h.weightKg), borderColor: PALETTE.violet, backgroundColor: "rgba(124,77,255,.12)",
    fill: true, tension: .3, pointRadius: 4, pointBackgroundColor: PALETTE.violet
  }];
  if (s.targetWeight) {
    datasets.push({ label: "Target", data: history.map(() => s.targetWeight), borderColor: PALETTE.green, borderDash: [6, 6], pointRadius: 0 });
  }
  drawChart("weightChart", {
    type: "line",
    data: { labels: history.map((h) => shortDate(h.date)), datasets },
    options: { scales: axisOptions({ beginAtZero: false }), plugins: { legend: { display: false } } }
  });
}

function renderAll(s) {
  document.getElementById("greeting").textContent = greeting() + ", " + getFullName().split(" ")[0];
  const goal = s.weightProgressPct;
  document.getElementById("hero-line").textContent =
    s.caloriesEatenToday === 0 && s.caloriesBurnedToday === 0
      ? "Nothing logged yet today. A quick workout or your first meal gets the day started."
      : "You have " + num(Math.max(0, s.remainingCalories)) + " kcal left in today's budget" +
        (goal !== null ? " and you are " + num(goal) + "% of the way to your target weight." : ".");
  document.getElementById("hero-stats").innerHTML =
    '<div class="hero-stat"><span>Daily target</span><b>' + num(s.calorieTarget) + ' kcal</b></div>' +
    '<div class="hero-stat"><span>Workout streak</span><b>' + s.streaks.workout + (s.streaks.workout === 1 ? ' day' : ' days') + '</b></div>' +
    '<div class="hero-stat"><span>BMR</span><b>' + num(s.bmr) + ' kcal</b></div>';
  renderTiles(s);
  renderRings(s);
  renderLists(s);
  renderRest(s);
  renderCharts(s);
}

async function load() {
  showSkeleton();
  try {
    await Promise.all([loadCatalog("exercises"), loadCatalog("foods")]);
    const s = await apiGet("/dashboard");
    document.getElementById("state").innerHTML = "";
    document.getElementById("view").classList.remove("hide");
    renderAll(s);
  } catch (err) {
    document.getElementById("view").classList.add("hide");
    if (/profile/i.test(err.message)) {
      document.getElementById("state").innerHTML =
        '<div class="card">' + emptyState("user", "Set up your profile first", "We need your age, height, weight and goal to calculate your calorie target and BMI.") +
        '<div class="right" style="text-align:center"><a class="btn" href="profile.html">Complete profile</a></div></div>';
    } else {
      document.getElementById("state").innerHTML =
        '<div class="card">' + emptyState("alert", "Could not load your dashboard", err.message) +
        '<div style="text-align:center"><button class="btn" onclick="load()">Try again</button></div></div>';
    }
  }
}

async function refreshQuiet() {
  try {
    renderAll(await apiGet("/dashboard"));
  } catch (err) {
    toast(err.message, "error");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  if (!getToken()) return;
  document.querySelectorAll("[data-ml]").forEach((b) => b.addEventListener("click", async () => {
    try {
      await apiPost("/water", { amountMl: Number(b.dataset.ml) });
      toast("Added " + b.dataset.ml + " ml of water", "success");
      refreshQuiet();
    } catch (err) { toast(err.message, "error"); }
  }));
  document.getElementById("water-undo").addEventListener("click", async () => {
    try {
      await apiDelete("/water/last");
      refreshQuiet();
    } catch (err) { toast(err.message, "error"); }
  });
  document.getElementById("save-activity").addEventListener("click", async () => {
    const steps = parseInt(document.getElementById("steps").value || "0", 10);
    const activeMinutes = parseInt(document.getElementById("active").value || "0", 10);
    try {
      await apiPost("/activity", { steps, activeMinutes });
      toast("Activity saved", "success");
      refreshQuiet();
    } catch (err) { toast(err.message, "error"); }
  });
  load();
});
</script>
</body>
</html>
