<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Report | FitTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="report">
<div id="content" hidden>
  <div class="page-head">
    <div><h1>Weekly report</h1><p>A one-page summary you can print or save as a PDF.</p></div>
    <div class="head-actions">
      <select id="week" style="border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff">
        <option value="0">This week</option><option value="1">Last week</option><option value="2">2 weeks ago</option><option value="3">3 weeks ago</option>
      </select>
      <button class="btn" id="print" type="button"></button>
    </div>
  </div>
  <div id="state"></div>
  <div class="report-sheet hide" id="sheet">
    <h1>Weekly fitness report</h1>
    <div class="report-meta" id="meta"></div>
    <div class="report-kpis" id="kpis"></div>
    <div class="chart-box short"><canvas id="chart"></canvas></div>
    <h2 class="mt">Day by day</h2>
    <div class="scroll-x mt"><table class="data" id="table"></table></div>
    <h2 class="mt">Summary</h2>
    <ul id="summary" style="margin:10px 0 0 20px;line-height:1.8"></ul>
  </div>
</div>
<script src="js/vendor/chart.umd.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/charts.js"></script>
<script>
function fullDate(iso) {
  return parseDay(iso).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
}

function render(r) {
  const t = r.totals;
  document.getElementById("meta").textContent = r.name + " · " + fullDate(r.from) + " to " + fullDate(r.to) + " · Generated " + fullDate(r.generatedOn);
  const kpis = [
    [t.workouts, "Workouts"], [t.workoutMinutes + " min", "Training time"], [num(t.caloriesBurned) + " kcal", "Burned"], [num(t.averageCaloriesEaten) + " kcal", "Avg. daily intake"],
    [num(t.totalSteps), "Steps"], [num(t.averageWaterMl) + " ml", "Avg. daily water"], [r.bmi + " (" + r.bmiCategory + ")", "BMI"], [r.weightEnd !== null ? num(r.weightEnd, 1) + " kg" : "No weigh-in", "Weight"]
  ];
  document.getElementById("kpis").innerHTML = kpis.map((k) => "<div><b>" + k[0] + "</b><span>" + k[1] + "</span></div>").join("");

  drawChart("chart", {
    type: "bar",
    data: { labels: r.days.map((d) => shortDay(d.date)), datasets: [
      { label: "Eaten", data: r.days.map((d) => d.caloriesEaten), backgroundColor: PALETTE.orange, borderRadius: 5 },
      { label: "Burned", data: r.days.map((d) => d.caloriesBurned), backgroundColor: PALETTE.blue, borderRadius: 5 }
    ] },
    options: { animation: false, scales: axisOptions(), plugins: { legend: { position: "bottom", labels: { usePointStyle: true } } } }
  });

  document.getElementById("table").innerHTML =
    "<thead><tr><th>Day</th><th>Workouts</th><th>Minutes</th><th>Burned</th><th>Eaten</th><th>Water</th><th>Steps</th></tr></thead><tbody>" +
    r.days.map((d) => "<tr><td>" + shortDay(d.date) + " " + shortDate(d.date) + "</td><td>" + d.workouts + "</td><td>" + d.workoutMinutes + "</td><td>" + num(d.caloriesBurned) +
      "</td><td>" + num(d.caloriesEaten) + "</td><td>" + num(d.waterMl) + "</td><td>" + num(d.steps) + "</td></tr>").join("") + "</tbody>";

  const lines = [];
  lines.push(t.goalMet
    ? "You trained on " + t.workoutDays + " days, meeting your goal of " + r.workoutGoal + " workout days."
    : "You trained on " + t.workoutDays + " days against a goal of " + r.workoutGoal + ".");
  if (t.topExercise) lines.push("Most time was spent on " + t.topExercise + ".");
  lines.push("Daily calorie target: " + num(r.calorieTarget) + " kcal. Average intake on logged days: " + num(t.averageCaloriesEaten) + " kcal.");
  if (r.weightStart !== null && r.weightEnd !== null && r.weightStart !== r.weightEnd) {
    const diff = Math.round((r.weightEnd - r.weightStart) * 10) / 10;
    lines.push("Weight changed by " + (diff > 0 ? "+" : "") + diff + " kg during the week.");
  }
  document.getElementById("summary").innerHTML = lines.map((l) => "<li>" + esc(l) + "</li>").join("");
}

async function load() {
  document.getElementById("sheet").classList.add("hide");
  document.getElementById("state").innerHTML = '<div class="skeleton skel-tall"></div>';
  try {
    const r = await apiGet("/reports/weekly?weeksAgo=" + document.getElementById("week").value);
    document.getElementById("state").innerHTML = "";
    document.getElementById("sheet").classList.remove("hide");
    render(r);
  } catch (err) {
    document.getElementById("state").innerHTML = /profile/i.test(err.message)
      ? '<div class="card">' + emptyState("user", "Complete your profile first", "Your report uses your goals and targets.") + '<div style="text-align:center"><a class="btn" href="profile.html">Go to profile</a></div></div>'
      : '<div class="card">' + emptyState("alert", "Could not build the report", err.message) + "</div>";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  if (!getToken()) return;
  document.getElementById("print").innerHTML = icon("printer") + " Print / Save as PDF";
  document.getElementById("print").addEventListener("click", () => window.print());
  document.getElementById("week").addEventListener("change", load);
  load();
});
</script>
</body>
</html>
