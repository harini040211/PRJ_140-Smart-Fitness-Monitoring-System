<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition | FitTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="diet">
<div id="content" hidden>
  <div class="page-head">
    <div><h1>Nutrition</h1><p>Choose a food and a portion. Calories and macros are calculated for you.</p></div>
  </div>

  <div class="grid g-main" style="margin-bottom:22px">
    <div class="card">
      <div class="card-head"><h2>Today</h2><span class="sub" id="t-note"></span></div>
      <div class="progress orange"><i id="t-bar" style="width:0"></i></div>
      <div class="stat-pills mt" id="t-pills"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Macro split</h2></div>
      <div class="chart-box short"><canvas id="macroChart"></canvas></div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button type="button" data-tab="foods" class="on">Food database</button>
    <button type="button" data-tab="favorites">Favorites</button>
    <button type="button" data-tab="history">Meal history</button>
  </div>

  <section id="tab-foods">
    <div class="toolbar">
      <div class="search"><span id="search-icon"></span><input id="q" type="search" placeholder="Search foods" style="border:1.5px solid var(--line);border-radius:12px;padding:11px 14px 11px 42px;width:100%;background:#fbfdff"></div>
    </div>
    <div class="chips" id="cats" style="margin-bottom:18px"></div>
    <div class="item-grid" id="grid"></div>
  </section>

  <section id="tab-favorites" class="hide"><div class="item-grid" id="fav-grid"></div></section>

  <section id="tab-history" class="hide">
    <div class="card">
      <div class="toolbar">
        <select id="h-range">
          <option value="week">Last 7 days</option><option value="month">Last 30 days</option><option value="all">All time</option>
        </select>
        <select id="h-type"><option value="">All meals</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select>
        <button class="btn ghost small" id="h-export" type="button"></button>
      </div>
      <div id="h-list"></div>
    </div>
  </section>
</div>

<div class="modal-back" id="portion-modal">
  <div class="modal">
    <h2 id="pm-title"></h2>
    <p class="sub" id="pm-sub"></p>
    <div id="pm-alert" class="alert"></div>
    <div class="field"><label for="pm-servings">Servings</label>
      <div class="stepper"><button type="button" id="pm-minus">-</button><input id="pm-servings" type="number" min="0.25" max="20" step="0.25" value="1"><button type="button" id="pm-plus">+</button></div>
    </div>
    <div class="macro-preview" id="pm-preview"></div>
    <div class="form-grid">
      <div class="field"><label for="pm-type">Meal</label>
        <select id="pm-type"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div>
      <div class="field"><label for="pm-date">Date</label><input id="pm-date" type="date"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="pm-cancel">Cancel</button>
      <button class="btn" type="button" id="pm-save">Add to my day</button>
    </div>
  </div>
</div>

<script src="js/vendor/chart.umd.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/charts.js"></script>
<script>
const state = { foods: [], favorites: new Set(), meals: [], category: "All", target: 2000, picked: null };

function defaultMealType() {
  const h = new Date().getHours();
  return h < 11 ? "Breakfast" : h < 16 ? "Lunch" : h < 19 ? "Snack" : "Dinner";
}

function dietBadge(d) {
  return d === "nonveg" ? '<span class="badge red">Non-veg</span>' : d === "egg" ? '<span class="badge orange">Egg</span>' : '<span class="badge green">Veg</span>';
}

function foodCard(f) {
  const fav = state.favorites.has(f.id);
  return '<div class="item"><div class="item-top"><div class="item-art">' + f.icon + '</div>' +
    '<button type="button" class="icon-btn fav ' + (fav ? "on" : "") + '" data-fav="' + f.id + '" aria-label="Favorite">' + icon("star", fav ? "filled" : "") + "</button></div>" +
    "<h3>" + esc(f.name) + '</h3><div class="meta">' + dietBadge(f.diet) + '<span class="badge blue">' + esc(f.category) + "</span></div>" +
    '<div class="facts">' + num(f.calories) + " kcal per " + esc(f.serving) + "<br>P " + f.protein + " g · C " + f.carbs + " g · F " + f.fat + ' g</div>' +
    '<button type="button" class="btn" data-add="' + f.id + '">' + icon("plus") + " Add</button></div>";
}

function renderFoods() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = state.foods.filter((f) => (state.category === "All" || f.category === state.category) && (!q || f.name.toLowerCase().includes(q)));
  document.getElementById("grid").innerHTML = list.length ? list.map(foodCard).join("") : emptyState("search", "No foods match", "Try a different search or category.");
  const favs = state.foods.filter((f) => state.favorites.has(f.id));
  document.getElementById("fav-grid").innerHTML = favs.length ? favs.map(foodCard).join("") : emptyState("star", "No favorites yet", "Tap the star on a food to keep it here.");
}

function renderCategories() {
  const cats = ["All"].concat([...new Set(state.foods.map((f) => f.category))]);
  document.getElementById("cats").innerHTML = cats.map((c) =>
    '<button type="button" class="chip ' + (c === state.category ? "on" : "") + '" data-cat="' + c + '">' + c + "</button>").join("");
}

function renderToday() {
  const today = isoDate();
  const meals = state.meals.filter((m) => m.date === today);
  const sum = (k) => meals.reduce((s, m) => s + m[k], 0);
  const kcal = sum("calories");
  document.getElementById("t-note").textContent = num(kcal) + " of " + num(state.target) + " kcal";
  document.getElementById("t-bar").style.width = Math.min(100, (kcal / state.target) * 100) + "%";
  document.getElementById("t-pills").innerHTML =
    '<div class="pill-stat"><b>' + num(Math.max(0, state.target - kcal)) + "</b><span>kcal remaining</span></div>" +
    '<div class="pill-stat"><b>' + num(sum("protein"), 1) + " g</b><span>Protein</span></div>" +
    '<div class="pill-stat"><b>' + num(sum("carbs"), 1) + " g</b><span>Carbs</span></div>" +
    '<div class="pill-stat"><b>' + num(sum("fat"), 1) + " g</b><span>Fat</span></div>";

  const p = sum("protein") * 4, c = sum("carbs") * 4, f = sum("fat") * 9;
  const empty = p + c + f === 0;
  drawChart("macroChart", {
    type: "doughnut",
    data: {
      labels: ["Protein", "Carbs", "Fat"],
      datasets: [{ data: empty ? [1, 1, 1] : [p, c, f], backgroundColor: empty ? ["#e3eaf4", "#e3eaf4", "#e3eaf4"] : [PALETTE.blue, PALETTE.orange, PALETTE.red], borderWidth: 0 }]
    },
    options: { cutout: "66%", plugins: { legend: { position: "right", labels: { usePointStyle: true } }, tooltip: { enabled: !empty } } }
  });
}

function renderHistory() {
  const range = document.getElementById("h-range").value;
  const type = document.getElementById("h-type").value;
  const cutoff = range === "week" ? isoDate(new Date(Date.now() - 6 * 86400000)) : range === "month" ? isoDate(new Date(Date.now() - 29 * 86400000)) : "";
  const rows = state.meals.filter((m) => (!cutoff || m.date >= cutoff) && (!type || m.mealType === type));
  if (!rows.length) {
    document.getElementById("h-list").innerHTML = emptyState("utensils", "No meals found", "Add a meal from the food database.");
    return;
  }
  const byDay = {};
  rows.forEach((m) => { (byDay[m.date] = byDay[m.date] || []).push(m); });
  const art = (n) => (state.foods.find((f) => f.name === n) || {}).icon || "🍽️";
  document.getElementById("h-list").innerHTML = Object.keys(byDay).sort().reverse().map((d) => {
    const items = byDay[d];
    const total = items.reduce((s, m) => s + m.calories, 0);
    return '<div style="margin-bottom:18px"><div class="card-head" style="margin-bottom:6px"><h3>' + prettyDate(d) + '</h3><span class="sub">' + num(total) + " kcal</span></div><div class=\"list\">" +
      items.map((m) =>
        '<div class="row"><div class="art">' + art(m.foodName) + '</div><div class="grow"><b>' + esc(m.foodName) + "</b><span>" + esc(m.mealType) + " · " + m.servings +
        " serving" + (m.servings === 1 ? "" : "s") + " · P " + num(m.protein, 1) + " C " + num(m.carbs, 1) + " F " + num(m.fat, 1) + '</span></div><div class="end">' + num(m.calories) +
        "<small>kcal</small></div>" + '<button type="button" class="icon-btn" data-del="' + m.id + '" aria-label="Delete">' + icon("trash") + "</button></div>").join("") + "</div></div>";
  }).join("");
}

async function reloadMeals() {
  state.meals = await apiGet("/meals");
  renderToday();
  renderHistory();
}

function openPortion(id, presetServings, presetType) {
  state.picked = state.foods.find((f) => f.id === id);
  const f = state.picked;
  document.getElementById("pm-title").textContent = f.name;
  document.getElementById("pm-sub").textContent = "One serving is " + f.serving;
  document.getElementById("pm-servings").value = presetServings || 1;
  document.getElementById("pm-type").value = presetType || defaultMealType();
  document.getElementById("pm-date").value = isoDate();
  document.getElementById("pm-date").max = isoDate();
  showAlert("pm-alert", "");
  updatePreview();
  openModal("portion-modal");
}

function updatePreview() {
  const f = state.picked;
  const s = parseFloat(document.getElementById("pm-servings").value) || 0;
  const cells = [[f.calories * s, "kcal", 0], [f.protein * s, "protein g", 1], [f.carbs * s, "carbs g", 1], [f.fat * s, "fat g", 1]];
  document.getElementById("pm-preview").innerHTML = cells.map((c) => "<div><b>" + num(c[0], c[2]) + "</b><span>" + c[1] + "</span></div>").join("");
}

async function savePortion() {
  const btn = document.getElementById("pm-save");
  setBusy(btn, true, "Saving...");
  try {
    await apiPost("/meals", {
      foodId: state.picked.id,
      servings: parseFloat(document.getElementById("pm-servings").value),
      mealType: document.getElementById("pm-type").value,
      date: document.getElementById("pm-date").value || null
    });
    closeModal("portion-modal");
    toast(state.picked.name + " added", "success");
    await reloadMeals();
  } catch (err) {
    showAlert("pm-alert", err.message, "error");
  }
  setBusy(btn, false);
}

function switchTab(name) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  ["foods", "favorites", "history"].forEach((t) => document.getElementById("tab-" + t).classList.toggle("hide", t !== name));
}

document.addEventListener("DOMContentLoaded", async () => {
  if (!getToken()) return;
  const si = document.getElementById("search-icon");
  si.innerHTML = icon("search");
  si.style.cssText = "position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex";
  document.getElementById("h-export").innerHTML = icon("download") + " Export CSV";

  try {
    const [foods, favorites, meals, profile] = await Promise.all([loadCatalog("foods"), apiGet("/favorites"), apiGet("/meals"), apiGet("/profile")]);
    if (!profile) { window.location.href = "profile.html?welcome=1"; return; }
    state.foods = foods;
    state.favorites = new Set(favorites.filter((f) => f.kind === "food").map((f) => f.itemId));
    state.meals = meals;
    state.target = profile.calorieTarget;
  } catch (err) {
    toast(err.message, "error");
    return;
  }

  renderCategories();
  renderFoods();
  renderToday();
  renderHistory();

  document.getElementById("tabs").addEventListener("click", (e) => { if (e.target.dataset.tab) switchTab(e.target.dataset.tab); });
  document.getElementById("cats").addEventListener("click", (e) => {
    if (e.target.dataset.cat) { state.category = e.target.dataset.cat; renderCategories(); renderFoods(); }
  });
  document.getElementById("q").addEventListener("input", renderFoods);

  document.getElementById("content").addEventListener("click", async (e) => {
    const add = e.target.closest("[data-add]");
    if (add) { openPortion(add.dataset.add); return; }
    const fav = e.target.closest("[data-fav]");
    if (fav) {
      try {
        const res = await apiPost("/favorites/food/" + fav.dataset.fav);
        if (res.favorite) state.favorites.add(fav.dataset.fav); else state.favorites.delete(fav.dataset.fav);
        renderFoods();
      } catch (err) { toast(err.message, "error"); }
      return;
    }
    const del = e.target.closest("[data-del]");
    if (del && confirm("Remove this meal from your history?")) {
      try {
        await apiDelete("/meals/" + del.dataset.del);
        toast("Meal removed", "success");
        await reloadMeals();
      } catch (err) { toast(err.message, "error"); }
    }
  });

  document.getElementById("pm-servings").addEventListener("input", updatePreview);
  document.getElementById("pm-minus").addEventListener("click", () => {
    const el = document.getElementById("pm-servings");
    el.value = Math.max(0.25, (parseFloat(el.value) || 1) - 0.25);
    updatePreview();
  });
  document.getElementById("pm-plus").addEventListener("click", () => {
    const el = document.getElementById("pm-servings");
    el.value = Math.min(20, (parseFloat(el.value) || 0) + 0.25);
    updatePreview();
  });
  document.getElementById("pm-cancel").addEventListener("click", () => closeModal("portion-modal"));
  document.getElementById("pm-save").addEventListener("click", savePortion);
  ["h-range", "h-type"].forEach((id) => document.getElementById(id).addEventListener("change", renderHistory));
  document.getElementById("h-export").addEventListener("click", async () => {
    try { await downloadCsv("meals", "meals.csv"); } catch (err) { toast(err.message, "error"); }
  });

  const params = new URLSearchParams(location.search);
  if (params.get("food")) openPortion(params.get("food"), Number(params.get("servings")) || 1, params.get("type"));
});
</script>
</body>
</html>
