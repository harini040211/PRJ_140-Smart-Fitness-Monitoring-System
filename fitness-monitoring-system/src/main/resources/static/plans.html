<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Plans | FitTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="plans">
<div id="content" hidden>
  <div class="page-head">
    <div><h1>My plans</h1><p id="lead">Suggestions built from your goal, calorie target and food preference.</p></div>
  </div>
  <div class="tabs" id="tabs">
    <button type="button" data-tab="diet" class="on">Diet plan</button>
    <button type="button" data-tab="workout">Workout plan</button>
  </div>
  <div id="state"></div>
  <section id="tab-diet"></section>
  <section id="tab-workout" class="hide"></section>
</div>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
function renderDiet(plan) {
  const meals = plan.meals.map((m) =>
    '<div class="meal-block"><h3>' + esc(m.mealType) + "<span>" + num(m.calories) + " of ~" + num(m.budget) + " kcal</span></h3>" +
    (m.items.length ? m.items.map((i) =>
      '<div class="row"><div class="art">' + i.icon + '</div><div class="grow"><b>' + esc(i.name) + "</b><span>" + i.servings + " × " + esc(i.serving) + " · " + num(i.protein, 1) + " g protein</span></div>" +
      '<div class="end">' + num(i.calories) + "<small>kcal</small></div>" +
      '<a class="btn small secondary" href="diet.html?food=' + encodeURIComponent(i.foodId) + "&servings=" + i.servings + "&type=" + encodeURIComponent(m.mealType) + '">Log</a></div>').join("")
      : emptyState("utensils", "No matching foods", "Nothing in the database fits this meal and your preference.")) + "</div>").join("");
  document.getElementById("tab-diet").innerHTML =
    '<div class="alert info">A sample day of about ' + num(plan.planCalories) + " kcal against your " + num(plan.calorieTarget) + " kcal target for <b>" + esc(plan.goal) + "</b> (" +
    esc(plan.dietaryPreference) + "). Portions are approximate and rotate daily. Tap Log to add an item to today.</div>" +
    '<div class="grid g2">' + meals + "</div>";
}

function renderWorkout(plan) {
  const days = plan.days.map((d) =>
    '<div class="plan-day ' + (d.rest ? "rest" : "") + '"><h3>' + d.day + (d.rest ? "<span>Rest</span>" : "") + "</h3>" +
    (d.rest ? "<div>Recovery day. Light stretching or a walk is plenty.</div>" :
      d.items.map((i) =>
        '<div class="plan-item"><span class="e" style="margin:0;color:inherit">' + i.icon + "</span><a href=\"workout.html?start=" + encodeURIComponent(i.exerciseId) + '">' + esc(i.name) + "</a><span>" + i.minutes + " min · " + esc(i.intensity) + "</span></div>").join("")) + "</div>").join("");
  document.getElementById("tab-workout").innerHTML =
    '<div class="alert info">' + plan.sessionsPerWeek + " sessions a week for <b>" + esc(plan.goal) + "</b>, roughly " + num(plan.estimatedWeeklyCalories) +
    " kcal burned across the week at your current weight. Tap an exercise to start it.</div>" +
    '<div class="grid g3">' + days + "</div>";
}

document.addEventListener("DOMContentLoaded", async () => {
  if (!getToken()) return;
  document.getElementById("tabs").addEventListener("click", (e) => {
    const t = e.target.dataset.tab;
    if (!t) return;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
    document.getElementById("tab-diet").classList.toggle("hide", t !== "diet");
    document.getElementById("tab-workout").classList.toggle("hide", t !== "workout");
  });
  document.getElementById("state").innerHTML = '<div class="skeleton skel-tall"></div>';
  try {
    const [diet, workout] = await Promise.all([apiGet("/recommendations/diet"), apiGet("/recommendations/workout")]);
    document.getElementById("state").innerHTML = "";
    renderDiet(diet);
    renderWorkout(workout);
  } catch (err) {
    if (/profile/i.test(err.message)) {
      document.getElementById("state").innerHTML = '<div class="card">' + emptyState("user", "Complete your profile first", "Your plans depend on your goal and calorie target.") +
        '<div style="text-align:center"><a class="btn" href="profile.html">Go to profile</a></div></div>';
    } else {
      document.getElementById("state").innerHTML = '<div class="card">' + emptyState("alert", "Could not build your plans", err.message) + "</div>";
    }
  }
});
</script>
</body>
</html>
