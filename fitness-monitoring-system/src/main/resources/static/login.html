<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | FitTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
    <section class="auth-hero">
      <div class="brand" style="color:#fff;padding:0 0 28px"><div class="brand-mark" style="background:rgba(255,255,255,.2)" id="hero-mark"></div><div>FitTrack<small style="color:#dbe7ff">Fitness Monitor</small></div></div>
      <h1>Smarter tracking. Healthier you.</h1>
      <p>Log workouts and meals, watch your calories balance out automatically, and see your progress build week after week.</p>
      <div class="auth-points" id="hero-points"></div>
      <div class="auth-mock">
        <div class="mock-row"><span>This week</span><span>1,860 kcal burned</span></div>
        <div class="bars"><i style="height:35%"></i><i style="height:60%"></i><i style="height:45%"></i><i style="height:80%"></i><i style="height:55%"></i><i style="height:92%"></i><i style="height:70%"></i></div>
      </div>
    </section>
  <section class="auth-form-side">
    <div class="auth-card card">
      <div class="brand auth-brand"><div class="brand-mark" id="form-mark"></div><div>FitTrack</div></div>
      <h2>Welcome back</h2>
      <p class="lead">Log in to continue where you left off.</p>
      <div id="alert" class="alert"></div>
      <form id="form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></div>
        <button class="btn block" id="submit" type="submit">Log in</button>
      </form>
      <p class="switch">New here? <a href="register.html">Create an account</a></p>
    </div>
  </section>
</div>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-art.js"></script>
<script>
  if (getToken()) window.location.replace("dashboard.html");
  if (new URLSearchParams(location.search).get("expired")) {
    showAlert("alert", "Your session has expired. Please log in again.", "info");
  }
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) {
      showAlert("alert", "Please enter your email and password", "error");
      return;
    }
    setBusy(btn, true, "Logging in...");
    try {
      const data = await apiPost("/auth/login", { email, password });
      saveSession(data);
      window.location.href = "dashboard.html";
    } catch (err) {
      showAlert("alert", err.message, "error");
      setBusy(btn, false);
    }
  });
</script>
</body>
</html>
